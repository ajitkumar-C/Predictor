<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer Target Ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.95"/>
  
  <!-- Middle Target Ring -->
  <circle cx="32" cy="32" r="12" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
  
  <!-- Center Bullseye / Aim Point -->
  <circle cx="32" cy="32" r="6" fill="url(#accentGrad)"/>
  
  <!-- Crosshair Accents (Top, Bottom, Left, Right) -->
  <line x1="32" y1="6" x2="32" y2="13" stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="51" x2="32" y2="58" stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="13" y2="32" stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="51" y1="32" x2="58" y2="32" stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>
</svg>
